services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      QUEUE_IMPL: local
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jobmatch
      LOCAL_QUEUE_BASE_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
