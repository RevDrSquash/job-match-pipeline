services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18 images moved PGDATA under /var/lib/postgresql/<major>/,
      # so the volume mounts the parent directory rather than .../data.
      - pgdata:/var/lib/postgresql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      QUEUE_IMPL: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jobmatch
      LOCAL_QUEUE_BASE_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://app:8080
    ports:
      # Host 3100: Windows (Hyper-V/WSL) often reserves an excluded port range
      # covering 3000, which fails binds with EACCES. Container side stays 3000.
      - "3100:3000"
    environment:
      API_BASE_URL: http://app:8080
    depends_on:
      - app

volumes:
  pgdata:
