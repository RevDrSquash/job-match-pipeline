[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-match-pipeline"
version = "0.1.0"
description = "Job matching pipeline: ingest, extract, match, and generate fabrication-free resumes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "google-cloud-tasks==2.24.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "pypdf==6.16.1",
    "nh3==0.3.6",
    "langgraph==1.2.11",
    "langchain-google-genai==4.3.5",
    "langchain-anthropic==1.6.1",
]

[project.scripts]
jobmatch = "app.cli:main"
job-match-seed = "app.seed:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Hooks run under system python3 (macOS CLT can still be 3.9); these modules
# stay 3.9-import-safe, which conflicts with target-version py312 + UP.
"scripts/portinfo.py" = ["UP"]
"scripts/dev.py" = ["UP"]
".cursor/hooks/*.py" = ["UP", "E402"]
